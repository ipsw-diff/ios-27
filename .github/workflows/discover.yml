name: Discover iOS 27 firmware

on:
  pull_request:
    paths:
      - .github/workflows/discover.yml
      - manifests/**
      - track.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: ios-27-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    permissions:
      contents: read
    uses: ipsw-diff/catalog/.github/workflows/discover.yml@05d2db3e4a2e9af1f3f1b8dec58f93cb85bef8c3
    with:
      policy-path: track.json
      manifests-dir: manifests
