name: Discover iOS 27 firmware

on:
  pull_request:
    paths:
      - .github/workflows/discover.yml
      - diffs/**
      - manifests/**
      - track.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: ios-27-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    permissions:
      contents: read
    uses: ipsw-diff/catalog/.github/workflows/discover.yml@6a551b4ce81c1eb1b779d9cd005183000c49e6dd
    with:
      policy-path: track.json
      manifests-dir: manifests
